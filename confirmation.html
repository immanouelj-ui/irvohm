<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commande confirmée — IRV'OHM</title>
  <meta name="robots" content="noindex, nofollow"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>body { font-family: Inter, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl shadow-xl p-10 max-w-md w-full text-center">
    <div style="width:80px;height:80px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:40px">✅</div>
    <h1 style="font-family:Montserrat,sans-serif;font-size:26px;font-weight:700;color:#006d37;margin-bottom:10px">Commande confirmée !</h1>
    <p style="color:#6c7b6d;font-size:15px;margin-bottom:28px;line-height:1.6">
      Votre paiement a bien été reçu. Un email de confirmation vous a été envoyé.<br>
      Notre équipe vous contactera sous 24h pour finaliser votre installation.
    </p>
    <div id="mode-info" style="background:#f7f9fb;border-radius:16px;padding:18px 20px;margin-bottom:28px;font-size:14px;color:#3d4a3e;text-align:left"></div>
    <a href="/" style="display:inline-block;background:linear-gradient(135deg,#006d37,#006397);color:#fff;border-radius:14px;padding:14px 36px;font-size:15px;font-weight:600;text-decoration:none">
      Retour à l'accueil
    </a>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode');
    var sessionId = params.get('session_id');
    var el = document.getElementById('mode-info');

    if(mode === 'klarna'){
      el.innerHTML = '<strong>Mode Klarna 3×</strong><br>Votre 1ère mensualité a été débitée. Les deux suivantes seront prélevées automatiquement à 30 et 60 jours.';

      if (sessionId) {
        fetch('/api/confirm-klarna-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: sessionId })
        }).catch(function(err) {
          console.error('Erreur confirmation Klarna:', err);
        });
      }
    } else {
      el.innerHTML = '<strong>Paiement sécurisé Stripe</strong><br>Votre paiement a été traité avec succès.';
    }
  </script>
</body>
</html>
